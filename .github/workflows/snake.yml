name: 🐍 Generate Snake Animation

on:
  schedule: # executa automaticamente todo dia às 3h (UTC)
    - cron: "0 3 * * *"
  workflow_dispatch: # permite rodar manualmente pelo GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout do repositório
        uses: actions/checkout@v3

      - name: 🐍 Gerar animação Snake
        uses: Platane/snk@v3
        with:
          github_user_name: fiamaribeiro
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: 🚀 Publicar resultado na branch 'output'
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
