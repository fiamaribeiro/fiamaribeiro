name: 🐍 Generate Snake Animation

on:
  schedule:
    # Roda todo dia às 3h UTC
    - cron: "0 3 * * *"
  workflow_dispatch: # Permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    # Permissão para commitar no repositório
    permissions:
      contents: write

    steps:
      - name: 🧩 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Gerar animação Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: fiamaribeiro
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: 🚀 Commit e push dos arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg

          # Se não houver mudanças, não falha
          git commit -m "chore: update snake animation" || exit 0

          git push
